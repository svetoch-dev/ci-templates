name: Update and push new image tag

on:
  workflow_call:
    inputs:
      infra_repo_url:
        description: SSH clone URL for the infrastructure repository
        type: string
        required: true
      ci_image:
        description: Container image providing ci-update-image-tag.sh, Git, OpenSSH, and yq
        type: string
        required: true
      runner:
        description: Runner name
        type: string
        required: true
      infra_branch:
        description: Infrastructure branch
        type: string
        required: false
        default: 'master'
      values_file:
        description: Values file relative to the infrastructure repository root
        type: string
        required: true
      image_tag:
        description: Image tag value to write to the values file
        type: string
        required: true
      tag_path:
        description: Image tag path
        type: string
        required: false
        default: '.global.image.tag'
      infra_repo_workdir:
        description: Infrastructure repository workdir name
        type: string
        required: false
        default: 'infrastructure'

permissions:
  contents: read

jobs:
  update-values-file:
    runs-on: ${{ inputs.runner }}
    container:
      image: '${{ inputs.ci_image }}'
    steps:
      - name: Update image tag and push
        env:
          INFRA_REPO_URL: ${{ inputs.infra_repo_url }}
          INFRA_BRANCH: ${{ inputs.infra_branch }}
          INFRA_WORKDIR: ${{ inputs.infra_repo_workdir }}
          VALUES_FILE: ${{ inputs.values_file }}
          TAG_PATH: ${{ inputs.tag_path }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@svetoch.dev
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@svetoch.dev
        shell: sh
        run: ci-update-image-tag.sh
