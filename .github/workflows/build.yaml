name: Build
on:
  workflow_call:
    inputs:
      registry:
        description: Artifact or container registry hostname
        type: string
        required: true
      runner:
        description: Runner name
        type: string
        required: true
      image:
        description: Image url in registry without a tag
        type: string
        required: true
      kaniko_image:
        description: Container image that provides the Kaniko executor
        type: string
        required: true
      context:
        description: Kaniko source context in repository-url#ref#commit format
        type: string
        required: true
      image_tag:
        description: Tag identifying the source revision
        type: string
        required: true
      git_username:
        description: Username for authenticating to the source Git repository
        type: string
        required: false
        default: ''
      dockerfile:
        description: Path to Dockerfile
        type: string
        required: false
        default: './Dockerfile'
      cache:
        description: Enable Kaniko cache
        type: boolean
        required: false
        default: true
      push_retry:
        description: Number of retries for pushing an image
        type: number
        required: false
        default: 5
      args:
        description: Additional Kaniko flags separated by whitespace; values must not contain whitespace
        type: string
        required: false
        default: ''
    secrets:
      source_token:
        required: false
      secret_build_args:
        description: Secret build arguments as NAME=value lines; values must not contain newlines
        required: false

permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    container:
      image: '${{ inputs.kaniko_image }}'
    steps:
      - name: Configure registry credentials
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          case "$REGISTRY" in
            *.pkg.dev) docker-credential-gcr configure-docker --registries="$REGISTRY" ;;
          esac
      - name: Build and push container
        env:
          CACHE: ${{ inputs.cache }}
          PUSH_RETRY: ${{ inputs.push_retry }}
          KANIKO_ARGS: ${{ inputs.args }}
          IMAGE: ${{ inputs.image }}
          SECRET_BUILD_ARGS: ${{ secrets.secret_build_args }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_CONTEXT: ${{ inputs.context }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GIT_USERNAME: ${{ inputs.git_username }}
          GIT_PASSWORD: ${{ secrets.source_token }}
        shell: sh
        run: |
          set -euf
          set --
          while IFS= read -r arg || [ -n "$arg" ]; do
            [ -z "$arg" ] || set -- "$@" "--build-arg=$arg"
          done <<EOF
          $SECRET_BUILD_ARGS
          EOF
          exec /kaniko/executor \
            --dockerfile="$DOCKERFILE" \
            --context="$BUILD_CONTEXT" \
            --destination="$IMAGE:$IMAGE_TAG" \
            --destination="$IMAGE:latest" \
            --cache="$CACHE" \
            --push-retry="$PUSH_RETRY" \
            "$@" \
            $KANIKO_ARGS
